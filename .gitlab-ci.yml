# Candidate-owned test evidence only; success here is not protected release authority.
# The external Pipeline Execution Policy/compliance verifier owns authority checks independently.
stages:
  - verify

variables:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  NODE_VERSION: "20.19.4"
  NODE_LINUX_X64_SHA256: "7a488a09e2fc02fbd1bc4ae084bea8a589314f741c182fc02c5f3f07c79a29d4"
  LSOF_DEB_VERSION: "4.95.0-1"
  LSOF_DEB_AMD64_SHA256: "e4b15cf8d0b9051cf7957e7ab29a67ca7d21f42ea1b2b7dad1b52e65d02d1408"

candidate-selftest-evidence:
  stage: verify
  image: python:3.9.21-bookworm@sha256:ce9f7ea06625d0ef77a6a912811be999d90ca0e62920b93640f63f80ab97b5dc
  tags: [hk-cluster-devops-cicd]
  interruptible: true
  timeout: 60m
  parallel:
    matrix:
      - SHARD: ["1/2", "2/2"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - test "$(uname -s)" = Linux
    - test "$(uname -m)" = x86_64
    - |-
      python3 - <<'PY'
      from pathlib import Path
      import hashlib
      import io
      import os
      import stat
      import tarfile
      import urllib.request

      version = os.environ["NODE_VERSION"]
      expected = os.environ["NODE_LINUX_X64_SHA256"]
      archive = Path(".ci-node.tar.xz")
      url = f"https://nodejs.org/dist/v{version}/node-v{version}-linux-x64.tar.xz"
      digest = hashlib.sha256()
      maximum_archive_bytes = 128 * 1024 * 1024
      downloaded = 0
      with urllib.request.urlopen(url, timeout=30) as response, archive.open("wb") as output:
          declared = response.headers.get("Content-Length")
          if declared is not None and (not declared.isdigit() or int(declared) > maximum_archive_bytes):
              raise SystemExit("Node archive Content-Length is invalid or exceeds its bound")
          while True:
              chunk = response.read(1024 * 1024)
              if not chunk:
                  break
              downloaded += len(chunk)
              if downloaded > maximum_archive_bytes:
                  raise SystemExit("Node archive exceeds its bounded download size")
              digest.update(chunk)
              output.write(chunk)
      if digest.hexdigest() != expected:
          raise SystemExit("Node archive SHA-256 mismatch")
      member_name = f"node-v{version}-linux-x64/bin/node"
      with tarfile.open(archive, "r:xz") as bundle:
          member = bundle.getmember(member_name)
          if not member.isfile() or member.size <= 0 or member.size > 256 * 1024 * 1024:
              raise SystemExit("Node archive member is invalid")
          source = bundle.extractfile(member)
          if source is None:
              raise SystemExit("Node archive member is unreadable")
          trusted_root = Path("/opt/agent-ci-tools")
          trusted_parent = trusted_root.parent.lstat()
          if (not stat.S_ISDIR(trusted_parent.st_mode) or trusted_parent.st_uid != 0
                  or trusted_parent.st_mode & 0o022):
              raise SystemExit("trusted tool parent is not root-owned and immutable to other users")
          if trusted_root.exists() or trusted_root.is_symlink():
              raise SystemExit("trusted tool root already exists")
          trusted_root.mkdir(mode=0o755)
          destination = trusted_root / "node"
          with destination.open("xb") as output:
              while True:
                  chunk = source.read(1024 * 1024)
                  if not chunk:
                      break
                  output.write(chunk)
          destination.chmod(0o755)
      archive.unlink()
      lsof_version = os.environ["LSOF_DEB_VERSION"]
      lsof_expected = os.environ["LSOF_DEB_AMD64_SHA256"]
      lsof_url = f"https://deb.debian.org/debian/pool/main/l/lsof/lsof_{lsof_version}_amd64.deb"
      lsof_package = bytearray()
      lsof_digest = hashlib.sha256()
      maximum_lsof_package_bytes = 2 * 1024 * 1024
      with urllib.request.urlopen(lsof_url, timeout=30) as response:
          declared = response.headers.get("Content-Length")
          if declared is not None and (not declared.isdigit() or int(declared) > maximum_lsof_package_bytes):
              raise SystemExit("lsof package Content-Length is invalid or exceeds its bound")
          while True:
              chunk = response.read(256 * 1024)
              if not chunk:
                  break
              lsof_package.extend(chunk)
              if len(lsof_package) > maximum_lsof_package_bytes:
                  raise SystemExit("lsof package exceeds its bounded download size")
              lsof_digest.update(chunk)
      if lsof_digest.hexdigest() != lsof_expected:
          raise SystemExit("lsof package SHA-256 mismatch")
      package = bytes(lsof_package)
      if not package.startswith(b"!<arch>\n"):
          raise SystemExit("lsof package is not a Debian ar archive")
      data_archive = None
      offset = 8
      while offset < len(package):
          header = package[offset:offset + 60]
          if len(header) != 60 or header[58:60] != b"`\n":
              raise SystemExit("lsof package has an invalid ar header")
          name = header[:16].decode("ascii").strip().rstrip("/")
          raw_size = header[48:58].decode("ascii").strip()
          if not raw_size.isdigit():
              raise SystemExit("lsof package has an invalid ar member size")
          size = int(raw_size)
          start = offset + 60
          end = start + size
          if end > len(package):
              raise SystemExit("lsof package has a truncated ar member")
          if name == "data.tar.xz":
              if data_archive is not None:
                  raise SystemExit("lsof package repeats data.tar.xz")
              data_archive = package[start:end]
          offset = end + (size % 2)
      if offset != len(package) or data_archive is None:
          raise SystemExit("lsof package has no exact data.tar.xz payload")
      with tarfile.open(fileobj=io.BytesIO(data_archive), mode="r:xz") as bundle:
          member = bundle.getmember("./usr/bin/lsof")
          if not member.isfile() or member.size <= 0 or member.size > 2 * 1024 * 1024:
              raise SystemExit("lsof package executable member is invalid")
          source = bundle.extractfile(member)
          if source is None:
              raise SystemExit("lsof package executable member is unreadable")
          lsof_destination = trusted_root / "lsof"
          with lsof_destination.open("xb") as output:
              while True:
                  chunk = source.read(256 * 1024)
                  if not chunk:
                      break
                  output.write(chunk)
          lsof_destination.chmod(0o755)
      PY
    - export PATH="/opt/agent-ci-tools:$PATH"
    - python3 --version
    - node --version
    - lsof -v
    - git --version
  script:
    - mkdir -m 700 .ci-home
    - |-
      set -eu
      for context in idle-source polluted-source installed-project; do
        env -i PATH="/opt/agent-ci-tools:/usr/local/bin:/usr/bin:/bin" HOME="$CI_PROJECT_DIR/.ci-home" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 python3 tests/run_all.py --context "$context" --shard "$SHARD" --test-timeout 600 --require-command python --require-command node --require-command lsof --require-command git --fail-on-skip --allow-skip .agent/skills/manage-local-runtime/scripts/self_test_docker_http.py --report "outputs/gitlab-self-suite-minimum-$context-$CI_NODE_INDEX.json"
      done
  after_script:
    - rm -rf -- /opt/agent-ci-tools .ci-home .ci-node.tar.xz
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - outputs/gitlab-self-suite-*.json
