# Candidate-owned pipeline evidence only; this file and every included job can be changed or shadowed by a merge request.
# Required security/release authority MUST be a protected GitLab Pipeline Execution Policy or compliance pipeline
# in an external protected project at AGENT_GITLAB_AUTHORITY_REF_SHA. Provider preflight must validate the
# effective merged configuration and collision evidence digests below; no local/included job name is authority.
stages:
  - verify

variables:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  NODE_VERSION: "20.19.4"
  NODE_LINUX_X64_SHA256: "7a488a09e2fc02fbd1bc4ae084bea8a589314f741c182fc02c5f3f07c79a29d4"

candidate-selftest-evidence:
  stage: verify
  image: python:3.9.21-bookworm@sha256:ce9f7ea06625d0ef77a6a912811be999d90ca0e62920b93640f63f80ab97b5dc
  interruptible: true
  timeout: 35m
  parallel:
    matrix:
      - SHARD: ["1/2", "2/2"]
        CONTEXT: ["idle-source", "polluted-source", "installed-project"]
        TOOLCHAIN: ["minimum"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - |
      case "${AGENT_GITLAB_AUTHORITY_MODE:-}" in pipeline-execution-policy|compliance-pipeline) ;; *) echo "missing protected external GitLab authority mode" >&2; exit 2;; esac
      printf '%s' "${AGENT_GITLAB_AUTHORITY_PROJECT_ID:-}" | grep -Eq '^[1-9][0-9]{0,19}$' || { echo "invalid external authority project" >&2; exit 2; }
      printf '%s' "${AGENT_GITLAB_AUTHORITY_REF_SHA:-}" | grep -Eq '^[0-9a-f]{40}$' || { echo "external authority ref is not immutable" >&2; exit 2; }
      printf '%s' "${AGENT_GITLAB_EFFECTIVE_CONFIG_SHA256:-}" | grep -Eq '^[0-9a-f]{64}$' || { echo "missing effective merged config evidence" >&2; exit 2; }
      printf '%s' "${AGENT_GITLAB_COLLISION_EVIDENCE_SHA256:-}" | grep -Eq '^[0-9a-f]{64}$' || { echo "missing collision evidence" >&2; exit 2; }
      test "$(uname -s)" = Linux
      test "$(uname -m)" = x86_64
      python3 - <<'PY'
      from pathlib import Path
      import hashlib
      import os
      import tarfile
      import urllib.request

      version = os.environ["NODE_VERSION"]
      expected = os.environ["NODE_LINUX_X64_SHA256"]
      archive = Path(".ci-node.tar.xz")
      url = f"https://nodejs.org/dist/v{version}/node-v{version}-linux-x64.tar.xz"
      digest = hashlib.sha256()
      maximum_archive_bytes = 128 * 1024 * 1024
      downloaded = 0
      with urllib.request.urlopen(url, timeout=30) as response, archive.open("wb") as output:
          declared = response.headers.get("Content-Length")
          if declared is not None and (not declared.isdigit() or int(declared) > maximum_archive_bytes):
              raise SystemExit("Node archive Content-Length is invalid or exceeds its bound")
          while True:
              chunk = response.read(1024 * 1024)
              if not chunk:
                  break
              downloaded += len(chunk)
              if downloaded > maximum_archive_bytes:
                  raise SystemExit("Node archive exceeds its bounded download size")
              digest.update(chunk)
              output.write(chunk)
      if digest.hexdigest() != expected:
          raise SystemExit("Node archive SHA-256 mismatch")
      member_name = f"node-v{version}-linux-x64/bin/node"
      with tarfile.open(archive, "r:xz") as bundle:
          member = bundle.getmember(member_name)
          if not member.isfile() or member.size <= 0 or member.size > 256 * 1024 * 1024:
              raise SystemExit("Node archive member is invalid")
          source = bundle.extractfile(member)
          if source is None:
              raise SystemExit("Node archive member is unreadable")
          destination = Path(".ci-bin/node")
          destination.parent.mkdir(mode=0o755, exist_ok=True)
          destination.write_bytes(source.read())
          destination.chmod(0o755)
      archive.unlink()
      PY
    - export PATH="$CI_PROJECT_DIR/.ci-bin:$PATH"
    - python3 --version
    - node --version
    - git --version
  script:
    - export PATH="$CI_PROJECT_DIR/.ci-bin:$PATH"
    - mkdir -m 700 .ci-home
    - env -i PATH="$CI_PROJECT_DIR/.ci-bin:/usr/local/bin:/usr/bin:/bin" HOME="$CI_PROJECT_DIR/.ci-home" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 python3 tests/run_all.py --context "$CONTEXT" --shard "$SHARD" --test-timeout 600 --require-command python --require-command node --require-command git --fail-on-skip --allow-skip .agent/skills/manage-local-runtime/scripts/self_test_docker_http.py --report "outputs/gitlab-self-suite-${TOOLCHAIN}-${CONTEXT}-${CI_NODE_INDEX}.json"
  after_script:
    - rm -rf -- .ci-bin .ci-home .ci-node.tar.xz
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - outputs/gitlab-self-suite-*.json

.gitlab-host-toolchain-matrix:
  stage: verify
  parallel:
    matrix:
      - CONTEXT: ["idle-source", "polluted-source", "installed-project"]
        SHARD: ["1/2", "2/2"]
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
  script:
    - python3 -c 'import os,sys; expected=(int(os.environ["EXPECTED_PY_MAJOR"]),int(os.environ["EXPECTED_PY_MINOR"])); raise SystemExit(0 if sys.version_info[:2]==expected and sys.platform==os.environ["EXPECTED_PLATFORM"] else 1)'
    - node -e 'if (process.version !== "v" + process.env.EXPECTED_NODE) process.exit(1)'
    - python3 tests/run_all.py --context "$CONTEXT" --shard "$SHARD" --test-timeout 600 --require-command python --require-command node --require-command git --fail-on-skip --allow-skip .agent/skills/manage-local-runtime/scripts/self_test_docker_http.py --report "outputs/gitlab-self-suite-${TOOLCHAIN}-${EXPECTED_PLATFORM}-${CONTEXT}-${CI_NODE_INDEX}.json"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - outputs/gitlab-self-suite-*.json

candidate-selftest-modern-linux-evidence:
  extends: .gitlab-host-toolchain-matrix
