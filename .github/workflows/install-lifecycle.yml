name: install-lifecycle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  full-suite:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full test suite
        run: python3 tests/run_all.py
