name: selftest

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run self-test shard ${{ matrix.shard }}
        run: python3 tests/run_all.py --shard ${{ matrix.shard }}
