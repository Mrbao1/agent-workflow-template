# Candidate-owned test evidence only. Protected release authority remains outside this workflow.
# Missing external authority configuration must be reported by the protected verifier, not multiplied
# across candidate matrix jobs before the candidate tests can run.
name: candidate-selftest-evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }} / ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-24.04, macos-14]
        toolchain: [minimum, modern-pinned]
        shard: ["1/2", "2/2"]
        include:
          - os: ubuntu-24.04
            toolchain: minimum
            python-version: "3.9.21"
            node-version: "20.19.4"
          - os: macos-14
            toolchain: minimum
            python-version: "3.9.13"
            node-version: "20.19.4"
          - os: ubuntu-24.04
            toolchain: modern-pinned
            python-version: "3.14.0"
            node-version: "22.18.0"
          - os: macos-14
            toolchain: modern-pinned
            python-version: "3.14.0"
            node-version: "22.18.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Stage selected toolchains in owner-controlled paths
        shell: bash
        run: |
          set -euo pipefail
          export SELECTED_NODE="$(command -v node)"
          export SELECTED_PYTHON="$(python -I -B -c 'from pathlib import Path; import sys; print(Path(sys.executable).resolve(strict=True))')"
          export SELECTED_PYTHON_ROOT="$(python -I -B -c 'from pathlib import Path; import sys; print(Path(sys.base_prefix).resolve(strict=True))')"
          export SELECTED_UID="$(id -u)"
          export TRUSTED_TOOL_ROOT="$HOME/.agent-ci-tools"
          export TRUSTED_NODE="$TRUSTED_TOOL_ROOT/node"
          python -I -B - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import shutil
          import stat

          source = Path(os.environ["SELECTED_NODE"]).resolve(strict=True)
          destination = Path(os.environ["TRUSTED_NODE"])
          destination.parent.mkdir(mode=0o700, exist_ok=False)
          destination.parent.chmod(0o700)
          shutil.copyfile(source, destination)
          destination.chmod(0o500)
          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as handle:
                  while chunk := handle.read(1024 * 1024):
                      value.update(chunk)
              return value.hexdigest()
          if digest(source) != digest(destination):
              raise SystemExit("trusted Node copy digest mismatch")
          if not stat.S_ISREG(destination.lstat().st_mode):
              raise SystemExit("trusted Node copy is not regular")
          PY
          /usr/bin/sudo -n /usr/bin/env SELECTED_PYTHON="$SELECTED_PYTHON" SELECTED_PYTHON_ROOT="$SELECTED_PYTHON_ROOT" SELECTED_UID="$SELECTED_UID" "$SELECTED_PYTHON" -I -B - <<'PY'
          from pathlib import Path
          import os
          import stat

          target = Path(os.environ["SELECTED_PYTHON"]).resolve(strict=True)
          runtime_root = Path(os.environ["SELECTED_PYTHON_ROOT"]).resolve(strict=True)
          try:
              target.relative_to(runtime_root)
          except ValueError:
              raise SystemExit("selected Python executable escapes its runtime root")
          if max(len(os.fsencode(target)), len(os.fsencode(runtime_root))) > 4096:
              raise SystemExit("selected Python path exceeds its bound")
          current = Path(runtime_root.anchor)
          components = [current]
          for part in runtime_root.parts[1:]:
              current = current / part
              components.append(current)
          if len(components) > 64:
              raise SystemExit("selected Python owner chain exceeds its depth bound")
          allowed_owners = {0, int(os.environ["SELECTED_UID"])}
          for component in components:
              metadata = os.lstat(component)
              if stat.S_ISLNK(metadata.st_mode) or metadata.st_uid not in allowed_owners:
                  raise SystemExit("selected Python owner chain has an unsafe identity")
              if metadata.st_mode & 0o022:
                  os.chmod(component, stat.S_IMODE(metadata.st_mode) & ~0o022)
          entries = 0
          total_bytes = 0
          pending = [runtime_root]
          while pending:
              directory = pending.pop()
              with os.scandir(directory) as children:
                  for child in children:
                      entries += 1
                      if entries > 100000:
                          raise SystemExit("selected Python runtime exceeds its entry bound")
                      path = Path(child.path)
                      metadata = child.stat(follow_symlinks=False)
                      if metadata.st_uid not in allowed_owners:
                          raise SystemExit("selected Python runtime has an unsafe owner")
                      if stat.S_ISLNK(metadata.st_mode):
                          try:
                              path.resolve(strict=False).relative_to(runtime_root)
                          except (OSError, RuntimeError, ValueError):
                              raise SystemExit("selected Python runtime contains an external symlink")
                      elif stat.S_ISREG(metadata.st_mode):
                          total_bytes += metadata.st_size
                          if total_bytes > 2 * 1024 * 1024 * 1024:
                              raise SystemExit("selected Python runtime exceeds its byte bound")
                          if metadata.st_mode & 0o022:
                              os.chmod(path, stat.S_IMODE(metadata.st_mode) & ~0o022)
                      elif stat.S_ISDIR(metadata.st_mode):
                          if metadata.st_mode & 0o022:
                              os.chmod(path, stat.S_IMODE(metadata.st_mode) & ~0o022)
                          pending.append(path)
                      else:
                          raise SystemExit("selected Python runtime contains an unsupported entry")
          final = os.lstat(target)
          if not stat.S_ISREG(final.st_mode) or not final.st_mode & 0o111:
              raise SystemExit("selected Python target is not executable and regular")
          PY
          "$SELECTED_PYTHON" --version
          printf 'AGENT_CI_PYTHON=%s\n' "$SELECTED_PYTHON" >> "$GITHUB_ENV"
          printf '%s\n' "$TRUSTED_TOOL_ROOT" >> "$GITHUB_PATH"
      - name: Show pinned toolchain
        run: |
          "$AGENT_CI_PYTHON" --version
          node --version
      - name: Run all contexts in isolated shard
        shell: bash
        run: |
          set -euo pipefail
          for context in idle-source polluted-source installed-project; do
            "$AGENT_CI_PYTHON" tests/run_all.py \
              --context "$context" \
              --shard "${{ matrix.shard }}" \
              --jobs 1 \
              --test-timeout 600 \
              --require-command node \
              --require-command lsof \
              --require-command git \
              --fail-on-skip \
              --allow-skip .agent/skills/manage-local-runtime/scripts/self_test_docker_http.py \
              --report "outputs/self-suite-${{ matrix.os }}-${{ matrix.toolchain }}-$context-${{ strategy.job-index }}.json"
          done
      - name: Upload self-test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: self-suite-${{ matrix.os }}-${{ matrix.toolchain }}-${{ strategy.job-index }}
          path: outputs/self-suite-*.json
          if-no-files-found: warn
          retention-days: 14
