# Candidate-owned test evidence only. Protected release authority remains outside this workflow.
# Missing external authority configuration must be reported by the protected verifier, not multiplied
# across candidate matrix jobs before the candidate tests can run.
name: candidate-selftest-evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }} / ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-24.04, macos-14]
        toolchain: [minimum, modern-pinned]
        shard: ["1/2", "2/2"]
        include:
          - os: ubuntu-24.04
            toolchain: minimum
            python-version: "3.9.21"
            node-version: "20.19.4"
          - os: macos-14
            toolchain: minimum
            python-version: "3.9.13"
            node-version: "20.19.4"
          - os: ubuntu-24.04
            toolchain: modern-pinned
            python-version: "3.13.5"
            node-version: "22.18.0"
          - os: macos-14
            toolchain: modern-pinned
            python-version: "3.13.5"
            node-version: "22.18.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Stage selected Node.js in owner-only tool path
        shell: bash
        run: |
          set -euo pipefail
          selected_node="$(command -v node)"
          export SELECTED_NODE="$selected_node"
          export TRUSTED_NODE="$HOME/.agent-ci-tools/node"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import shutil
          import stat

          source = Path(os.environ["SELECTED_NODE"]).resolve(strict=True)
          destination = Path(os.environ["TRUSTED_NODE"])
          destination.parent.mkdir(mode=0o700, exist_ok=True)
          destination.parent.chmod(0o700)
          if destination.exists() or destination.is_symlink():
              raise SystemExit("trusted Node destination already exists")
          shutil.copyfile(source, destination)
          destination.chmod(0o500)
          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as handle:
                  while chunk := handle.read(1024 * 1024):
                      value.update(chunk)
              return value.hexdigest()
          if digest(source) != digest(destination):
              raise SystemExit("trusted Node copy digest mismatch")
          if not stat.S_ISREG(destination.lstat().st_mode):
              raise SystemExit("trusted Node copy is not regular")
          PY
          printf '%s\n' "$HOME/.agent-ci-tools" >> "$GITHUB_PATH"
      - name: Show pinned toolchain
        run: |
          python --version
          node --version
      - name: Run all contexts in isolated shard
        shell: bash
        run: |
          set -euo pipefail
          for context in idle-source polluted-source installed-project; do
            python tests/run_all.py \
              --context "$context" \
              --shard "${{ matrix.shard }}" \
              --test-timeout 600 \
              --require-command node \
              --require-command git \
              --fail-on-skip \
              --allow-skip .agent/skills/manage-local-runtime/scripts/self_test_docker_http.py \
              --report "outputs/self-suite-${{ matrix.os }}-${{ matrix.toolchain }}-$context-${{ strategy.job-index }}.json"
          done
      - name: Upload self-test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: self-suite-${{ matrix.os }}-${{ matrix.toolchain }}-${{ strategy.job-index }}
          path: outputs/self-suite-*.json
          if-no-files-found: warn
          retention-days: 14
